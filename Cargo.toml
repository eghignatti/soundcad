[workspace]
resolver = "2"
members = ["crates/soundcad-core", "crates/soundcad-tools", "crates/soundcad-xover", "crates/soundcad-speaker", "crates/soundcad"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[patch.crates-io]
webbrowser = { path = "crates/webbrowser-stub" }
